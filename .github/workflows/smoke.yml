name: smoke

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar dependências de teste
        run: npm install
      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium
      - name: Teste de fumaça (páginas + invariantes do grafo)
        run: npm test
