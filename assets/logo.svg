<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Atlas Bíblico Interativo — livro aberto com uma rota que sobe das páginas, com estações em losango e círculo">
  <defs>
    <linearGradient id="ouro" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#edca73"/>
      <stop offset="1" stop-color="#cf8f37"/>
    </linearGradient>
    <radialGradient id="ceu" cx="0.72" cy="0.2" r="0.9">
      <stop offset="0" stop-color="#1b2a3a"/>
      <stop offset="0.6" stop-color="#0e1218"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="100" fill="url(#ceu)"/>

  <!-- o livro aberto: as páginas viram terreno -->
  <g stroke-linejoin="round">
    <path d="M74 356 C150 318 218 320 252 342 L252 414 C218 392 150 390 74 424 Z"
          fill="#1a2432" stroke="#5d7183" stroke-width="6"/>
    <path d="M438 356 C362 318 294 320 260 342 L260 414 C294 392 362 390 438 424 Z"
          fill="#1a2432" stroke="#5d7183" stroke-width="6"/>
    <!-- linhas de texto/meridianos nas páginas -->
    <path d="M104 366 C160 340 208 340 236 354" fill="none" stroke="#3a4a5e" stroke-width="5" stroke-linecap="round"/>
    <path d="M104 392 C160 366 208 366 236 380" fill="none" stroke="#3a4a5e" stroke-width="5" stroke-linecap="round"/>
    <path d="M408 366 C352 340 304 340 276 354" fill="none" stroke="#3a4a5e" stroke-width="5" stroke-linecap="round"/>
    <path d="M408 392 C352 366 304 366 276 380" fill="none" stroke="#3a4a5e" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- a rota que sobe do livro -->
  <path d="M136 368 C198 328 218 262 256 216 C294 170 342 150 392 142"
        fill="none" stroke="url(#ouro)" stroke-width="14" stroke-linecap="round"/>
  <!-- continuação futura, pontilhada -->
  <path d="M414 138 C432 134 446 126 458 114"
        fill="none" stroke="#e9c46a" stroke-width="12" stroke-linecap="round" stroke-dasharray="1 24"/>

  <!-- estações: percorrida (cheia) · central (o marco do atlas) · futura (tracejada) -->
  <circle cx="136" cy="368" r="16" fill="#e9c46a" stroke="#0e1218" stroke-width="6"/>
  <g transform="rotate(45 256 216)">
    <rect x="227" y="187" width="58" height="58" rx="9" fill="#e9c46a"/>
    <rect x="243" y="203" width="26" height="26" rx="4" fill="#0e1218"/>
  </g>
  <circle cx="392" cy="142" r="15" fill="#0e1218" stroke="#e9c46a" stroke-width="7"/>
</svg>
